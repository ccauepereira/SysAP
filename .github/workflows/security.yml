name: Security checks

on:
  pull_request:
  push:
    branches:
      - main
      - mobileatleta
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sysap-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DO_NOT_TRACK: "1"

jobs:
  secrets:
    name: Segredos versionados
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout completo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          check-latest: false
      - name: Escanear estado e histórico sem rede de scanner
        run: node scripts/scan-secrets.mjs

  dependencies:
    name: Dependências
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          check-latest: false
      - name: pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.15.1
          run_install: false
      - name: Instalar dependências sem lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Auditar dependências
        run: pnpm security:dependencies
