name: PR checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sysap-pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DO_NOT_TRACK: "1"
  REDOCLY_TELEMETRY: "off"
  REDOCLY_SUPPRESS_UPDATE_NOTICE: "true"
  NO_UPDATE_NOTIFIER: "1"

jobs:
  quality:
    name: Qualidade do monorepo
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout completo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          check-latest: false
      - name: pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.15.1
          run_install: false
      - name: Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.26.5
          check-latest: false
      - name: Instalar dependências sem lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validar contrato OpenAPI
        run: pnpm openapi:lint
      - name: Executar checks reais
        run: pnpm check
      - name: Test Laya boundaries
        run: python3 -m unittest discover -s tools/laya_pr_gate -p 'test_*.py'
      - name: Validar diff sem whitespace inválido
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            git diff --check "$PR_BASE...HEAD"
          else
            git diff --check HEAD
          fi

  mobile:
    name: Mobile Flutter
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Flutter estável
        uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Resolver dependências do mobile
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Analisar mobile
        working-directory: apps/mobile
        run: flutter analyze
      - name: Testar mobile
        working-directory: apps/mobile
        run: flutter test

  laya-advisory:
    name: Laya advisory experimental
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Checkout completo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Revisar diff de forma advisory
        run: python3 tools/laya_pr_gate/review_diff.py --base "${{ github.event.pull_request.base.sha }}"
